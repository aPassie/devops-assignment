# Argo CD tracks the Helm chart in this repository. Changing values.yaml or a template and
# pushing to master is the deployment; nobody runs helm upgrade by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issue-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aPassie/devops-assignment.git
    targetRevision: master
    path: Final DevOps Project/helm/issue-tracker
    helm:
      releaseName: tracker
      valueFiles: [values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: issue-tracker
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
  # the HPA owns the backend replica count; do not treat its scaling as drift
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: tracker-backend
      jsonPointers: [/spec/replicas]
